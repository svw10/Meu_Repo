name: Antigravity OS CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # 🔹 GATE 1: Validação de Framework & Código
  validate:
    name: 🔍 Gate 1 — Framework & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: 'npm' }
      - run: npm ci
      - name: Validar Estrutura Antigravity
        run: bash ".antigravity-os/[08] SUBMODULE_HOOKS/[02] validate-structure.sh"
      - name: Lint & TypeCheck
        run: npm run lint && npx tsc --noEmit
      - name: Verificar Formatação
        run: npx biome format . --check

  # 🔹 GATE 2: Segurança (DELTA Automatizado)
  security:
    name: 🛡️ Gate 2 — Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: 'npm' }
      - run: npm ci
      - name: Executar Guardrails de Segurança
        run: bash ".antigravity-os/[08] SUBMODULE_HOOKS/[06] security-scan.sh"
      - name: Auditoria de Dependências
        run: npm audit --production --audit-level=high

  # 🔹 GATE 3: Suite de Testes
  test:
    name: 🧪 Gate 3 — Testes & Cobertura
    runs-on: ubuntu-latest
    needs: [validate, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: 'npm' }
      - run: npm ci
      - name: Rodar Testes com Threshold
        run: >
          npm run test -- 
          --coverage 
          --coverage.thresholds.statements=80 
          --coverage.thresholds.branches=80 
          --coverage.thresholds.functions=80 
          --coverage.thresholds.lines=80
      - name: Upload Coverage (Codecov)
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # 🔹 GATE 4: Build Verification
  build:
    name: 🏗️ Gate 4 — Build Next.js
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: 'npm' }
      - run: npm ci
      - name: Build de Produção
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}

  # 🔹 GATE 5: Deploy (Apenas main + push)
  deploy:
    name: 🚀 Gate 5 — Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
      - name: Health Check Pós-Deploy
        run: |
          sleep 15
          curl -f https://${{ secrets.VERCEL_DOMAIN }}/api/health || exit 1
